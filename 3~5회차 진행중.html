<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영어 타자 연습</title>
<style>
  :root { --bg: #fffdf5; --fg: #111; --muted: #3d3d3d; --card: #fff; --line: #222; --accent: #0b4fd6; --accent-fg: #fff; --focus: #ff8f00; --ok: #0a6b34; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f1419; --fg: #f7f7f7; --muted: #d6d6d6; --card: #1a222c; --line: #e9e9e9; --accent: #7fb0ff; --accent-fg: #0a1a33; --focus: #ffd54a; --ok: #6ff0a0; color-scheme: dark; } }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; font-size: 22px; line-height: 1.6; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 30px; margin: 8px 0 12px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .btn { font: inherit; font-size: 22px; font-weight: 700; padding: 12px 18px; min-height: 56px; background: var(--card); color: var(--fg); border: 3px solid var(--line); border-radius: 12px; cursor: pointer; margin: 4px; text-align: left; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn:focus-visible { outline: 5px solid var(--focus); outline-offset: 2px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .bar { margin: 12px 0; }
  .meta { color: var(--muted); font-size: 20px; }
  .sent { font-size: 48px; font-weight: 800; letter-spacing: 2px; margin: 18px 0 6px; word-break: break-word; }
  .typed { font-size: 28px; color: var(--muted); min-height: 44px; word-break: break-all; }
  .fb { min-height: 56px; padding: 10px 14px; border-left: 8px solid var(--accent); background: var(--card); border-radius: 8px; margin: 12px 0; }
  .menu { border: 4px solid var(--accent); border-radius: 14px; padding: 12px 16px; background: var(--card); margin: 12px 0; }
  .menu h2 { font-size: 26px; margin: 4px 0 8px; }
  mark.cur { background: var(--focus); color: #111; border-radius: 4px; padding: 0 2px; }
  .side { border: 3px solid var(--line); border-radius: 14px; padding: 12px 16px; background: var(--card); position: sticky; top: 8px; }
  .side h2 { font-size: 24px; margin: 4px 0 8px; }
  .side ol { margin: 0; padding-left: 0; list-style: none; }
  .side li { padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 19px; }
  .side li.done { color: var(--ok); font-weight: 700; }
  .side li.next { color: var(--accent); font-weight: 700; }
  .side .cur { font-size: 20px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="meta" style="margin:8px 0 0;font-size:20px">한국시각장애인복지관</p>
  <p class="meta" style="margin:0 0 8px;font-size:20px">점자문해교실 영어자판·컴퓨터 타자게임</p>
  <h1>영어 타자 게임</h1>



  <section id="hub" aria-label="회차 고르기">
    <p>소리가 나는 컴퓨터에서 회차를 골라 주세요. 바로 시작해요. 보너스 퀴즈 답은 A, S, D, F 키예요.</p>
    <button type="button" class="btn" id="hub3">3회 · 영타 게임 고치기</button>
    <button type="button" class="btn" id="hub4">4회 · 조건 (if) · 영타 게임 고치기</button>
    <button type="button" class="btn primary" id="hub5">5회 · 게임 느낌 (if-else)</button>
  </section>

  <section id="start" hidden>
    <p>5회 영타 게임이에요. 4회까지 고친 게임에서 이어서 시작해요. 시작하기를 눌러 주세요.</p>
    <p class="meta" id="keyhelp">7을 누르면 단축키 안내를 들을 수 있어요.</p>
    <button type="button" class="btn primary" id="btnStart">시작하기</button>
  </section>

  <div class="layout" id="app" hidden>
    <main>
      <p class="meta" id="ver"></p>
      <p class="sent" id="sent" aria-label="따라 칠 문장"></p>
      <p class="typed" id="typed" aria-label="친 글자"></p>
      <p class="meta" id="cursor" aria-live="polite"></p>
      <p class="meta" id="scoreline" aria-live="polite"></p>
      <div class="fb" id="fb" role="status" aria-live="polite"></div>

      <section id="quiz" aria-label="보너스 퀴즈" hidden style="border:4px solid currentColor;border-radius:14px;padding:12px 16px;margin:12px 0">
        <p id="quizQ" role="status" aria-live="polite" style="font-size:26px;font-weight:700"></p>
        <div id="quizOpts"></div>
      </section>

      <section class="menu" id="menu" hidden aria-label="고칠 것 고르기">
        <h2 id="q"></h2>
        <div id="opts"></div>
      </section>

      <div class="bar" role="group" aria-label="기본 버튼">
        <button type="button" class="btn" id="btnBack">← 뒤로 가기 (8)</button>
        <button type="button" class="btn" id="btnPick">고칠 것 고르기 (5)</button>
        <button type="button" class="btn" id="btnStop">소리 멈추기 (3)</button>
        <button type="button" class="btn" id="btnMusic">배경음악: 꺼짐 (6)</button>
        <button type="button" class="btn" id="btnKeys">단축키 안내 (7)</button>
        <button type="button" class="btn" id="btnHub">회차 고르기</button>
        <button type="button" class="btn" id="btnAgain">문장 다시 듣기 (1)</button>
        <button type="button" class="btn" id="btnTyped">지금까지 쓴 글자 읽기 (4)</button>
        <button type="button" class="btn" id="btnScore">점수 듣기 (2)</button>
        <button type="button" class="btn" id="btnFaster">빠르게 말하기 (=)</button>
        <button type="button" class="btn" id="btnSlower">느리게 말하기 (-)</button>
        <button type="button" class="btn" id="btnNext">지금 칠 글자 (9)</button>
        <button type="button" class="btn" id="btnCurL">커서 왼쪽 (←)</button>
        <button type="button" class="btn" id="btnCurR">커서 오른쪽 (→)</button>
        <button type="button" class="btn" id="btnSentL">예시 글자 앞으로 (Ctrl+←)</button>
        <button type="button" class="btn" id="btnSentR">예시 글자 뒤로 (Ctrl+→)</button>
      </div>
    </main>

    <aside class="side" id="side" aria-label="전체 구성"></aside>
  </div>
  <section id="over" aria-label="게임 끝" hidden>
    <h2>게임 끝!</h2>
    <p id="overText" role="status" aria-live="polite"></p>
    <label for="nameIn">이름 (별명, 열 글자 이내)</label>
    <input id="nameIn" maxlength="10" autocomplete="off" style="font:inherit;font-size:24px;min-height:56px;width:100%;box-sizing:border-box;margin:6px 0 12px;padding:8px 12px;border:3px solid currentColor;border-radius:12px;background:transparent;color:inherit">
    <button type="button" class="btn primary" id="btnSave">점수 저장</button>
    <button type="button" class="btn" id="btnBoard">점수판 듣기</button>
    <button type="button" class="btn" id="btnSlowerOver">느리게 말하기 (-)</button>
    <button type="button" class="btn" id="btnFasterOver">빠르게 말하기 (=)</button>
    <button type="button" class="btn" id="btnAgainGame">다시 하기 (엔터)</button>
    <button type="button" class="btn" id="btnHomeOver">처음 화면으로 (8)</button>
    <h2>점수판 (상위 50명)</h2>
    <ol id="board"></ol>
  </section>
</div>

<script src="voice/manifest.js"></script>

  function noiseBurst(t, dur, f0, f1, vol) {
    var a = ctx(); if (!a) return;
    var now = a.currentTime + t, len = Math.max(1, Math.floor(a.sampleRate * dur));
    var buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    var src = a.createBufferSource(); src.buffer = buf;
    var flt = a.createBiquadFilter(); flt.type = "bandpass";
    flt.frequency.setValueAtTime(f0, now); flt.frequency.exponentialRampToValueAtTime(f1, now + dur);
    var g = a.createGain();
    g.gain.setValueAtTime(0.0001, now); g.gain.linearRampToValueAtTime(vol, now + dur * 0.2); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    src.connect(flt); flt.connect(g); g.connect(a.destination);
    src.start(now); src.stop(now + dur + 0.05);
  }

    var now = a.currentTime + t, o = a.createOscillator(), g = a.createGain();

    g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);

  }

    if (p.lang === "en" && hasFile("EN|" + p.t)) return window.VOICE_MAP["EN|" + p.t];
    if (p.lang === "ko" && hasFile(p.t)) return window.VOICE_MAP[p.t];
    return null;
  }
  function speakSeq(parts) {
    parts = expandParts(parts);
    var my = ++tok;
    stopAudio();
    try { if (synth) synth.cancel(); } catch (e) {}
    (function next(i) {
      if (my !== tok || i >= parts.length) return;
      var p = parts[i];
      if (p.cb) { p.cb(); next(i + 1); return; }
      // 영어 문장은 말하기 속도와 따로 항상 천천히 읽어요 (안내 말만 속도 조절을 따라요)
      var rate = (p.sent ? 0.9 : speedRate()) * (p.r || 1);
      var src = fileFor(p);
      if (src) {
        // 파일을 못 읽으면 기계 음성으로 이어서 읽어요
        playFile(src, rate, function (ok) { if (ok) next(i + 1); else speakMachine(p, i, my, next, rate); });
        return;
      }
      speakMachine(p, i, my, next, rate);
    })(0);
  }
  // 기계 음성 (브라우저/PC에 있는 음성)으로 읽어요
  function speakMachine(p, i, my, next, rate) {
    if (!synth || my !== tok) { if (my === tok) next(i + 1); return; }
    var txt, lang;
    // alt(영어 글자 이름)은 영어 음성이 있을 때만 쓰고, 없으면 한국어로 읽어요
    var useEn = !!p.alt && hasEnVoice();
    if (useEn) { txt = p.alt; lang = "en-US"; }
    else if (p.lang === "ko") { txt = forSpeech(p.t); lang = "ko-KR"; }
    else if (hasEnVoice()) { txt = p.t; lang = "en-US"; }
    else { txt = phonetic(p.t); lang = "ko-KR"; }
    var u = new SpeechSynthesisUtterance(txt);
    u.lang = lang;
    var v = (useEn || p.lang === "en") ? voiceFor("en") : voiceFor("ko"); if (v) u.voice = v;
    u.rate = rate;
    u.onend = function () { next(i + 1); };
    u.onerror = function () { next(i + 1); };
    try { synth.speak(u); } catch (e) { next(i + 1); }
  }
  function stopAll() { tok++; stopAudio(); try { if (synth) synth.cancel(); } catch (e) {} clearTimeout(st.auto); }
  function ko(t) { return { t: t, lang: "ko" }; }
  function en(t) { return { t: t, lang: "en" }; }
  // 안내 문장: 게임 중이면 아래 칸에, 게임이 끝난 화면이면 점수 칸에도 보여 줘요
  function say(t) {
    $("fb").textContent = t;
    if (st.over) $("overText").textContent = t;
    speakSeq([ko(t)]);
  }
  // 퀴즈의 영어 단어는 말하기 속도와 상관없이 천천히 읽어요
  function enWord(t) { return { t: t, lang: "en", sent: true, slow: true }; }
  function enSent(t) { return { t: t, lang: "en", sent: true }; }
  var LET = { A: "에이", B: "비", C: "씨", D: "디", E: "이", F: "에프", G: "지", H: "에이치", I: "아이", J: "제이", K: "케이", L: "엘", M: "엠", N: "엔", O: "오", P: "피", Q: "큐", R: "알", S: "에스", T: "티", U: "유", V: "브이", W: "더블유", X: "엑스", Y: "와이", Z: "제트" };
  // 글자 하나는 알파벳 이름으로 읽어요. 예시문장 단어 안의 a는 "어"로 읽혀요.
  // 영어 글자 이름: 영어 음성이 있으면 이 이름으로 읽어요
  var LET_EN = { A: "ay", B: "bee", C: "see", D: "dee", E: "ee", F: "ef", G: "jee", H: "aitch", I: "eye", J: "jay", K: "kay", L: "el", M: "em", N: "en", O: "oh", P: "pee", Q: "cue", R: "ar", S: "ess", T: "tee", U: "you", V: "vee", W: "double you", X: "ex", Y: "why", Z: "zee" };
  var NAMES_EN = { " ": "space", ".": "period", ",": "comma", "!": "exclamation mark", "?": "question mark", "'": "apostrophe" };
  // 글자 하나를 영어 음성(Jenny)으로 읽는 조각이에요. 예: a → ay, 띄어쓰기 → space
  function engChar(ch) {
    var u = ch.toUpperCase();
    // 글자 이름은 한국어 음성으로 읽어요: 에이, 알, 쩜!, 스페이스
    return { t: NAMES[ch] || LET[u] || u, lang: "ko", r: 1.25 };
  }
  function charParts(ch) {
    var u = ch.toUpperCase();
    var ko = NAMES[ch] || LET[u] || u;
    var en = NAMES_EN[ch] || LET_EN[u] || ch;
    return { t: ko, lang: "ko", r: 1.25 };   // 글자 하나는 한국어 이름으로 읽어요 (A는 "에이"). 말하기 속도보다 조금 빠르게
  }
  function readSentence() { speakSeq([enSent(SENT[st.si])]); }

  /* 질문과 보기 */
  function buildOptions() {
    var k = cur(); if (!k) return [];
    // 틀린 보기 3개는 점수와 상관없는 짧은 명령으로 랜덤하게 골라요
    var others = Object.keys(DECOY).sort(function () { return Math.random() - 0.5; });
    var arr = others.slice(0, 3);
    arr.splice(Math.min(BUG[k].pos - 1, arr.length), 0, k);   // 정답 위치는 문제마다 정해져 있어요
    return arr;
  }
  function questionText() {
    var k = cur();
    return k ? BUG[k].q : "6개를 모두 고쳤어요. 여기까지 끝!";
  }
  // 보기는 "일번, 이번, 삼번, 사번"으로 읽고 그 보기 내용을 말해요 (미리 만든 음성으로)
  var OPT_NAMES = ["일번", "이번", "삼번", "사번"];
  var KNUM = ["", "일", "이", "삼", "사", "오", "육", "칠", "팔"];   // 버전 번호를 한글로 (버전 사)
  function menuParts() {
    var parts = [ko(questionText())];
    st.opts.forEach(function (k, i) { parts.push(ko(OPT_NAMES[i] || (i + 1) + "번"), ko(cmdOf(k))); });
    return parts;
  }
  function renderMenu() {
    st.opts = buildOptions();
    $("q").textContent = questionText();
    var box = $("opts"); box.innerHTML = "";
    st.opts.forEach(function (k, i) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "btn";
      b.textContent = (i + 1) + "번. " + cmdOf(k);
      b.addEventListener("click", function () { ctx(); pick(i); });
      box.appendChild(b);
    });
    $("menu").hidden = false; st.menu = true;
    speakSeq(menuParts());
  }
  function closeMenu() { $("menu").hidden = true; st.menu = false; }
  function toggleMenu() { ctx(); if (st.menu) closeMenu(); else renderMenu(); }

  /* 고르기: 정답만 실행돼요 */
  function pick(i) {
    if (!st.menu || i < 0 || i >= st.opts.length) return;
    var chosen = st.opts[i], k = cur();
    if (chosen !== k) {
      // 안내 문장은 조각으로 나눠서 미리 만든 음성으로 읽어요
      // 화면에는 숫자로, 소리는 "이번은 틀렸어요"처럼 한 덩어리로 읽어요
      var wrong = [ko(OPT_NAMES[i] + "은 틀렸어요."), ko("아무 일도 실행되지 않았어요."), ko("다시 골라 보세요.")];
      $("fb").textContent = (i + 1) + "번은 틀렸어요. 아무 일도 실행되지 않았어요. 다시 골라 보세요.";
      speakSeq(wrong);
      return;
    }
    st.fixed.push(k);
    st.combo = 0; st.streak = 0; st.pitch = 0;   // 고친 뒤에는 콤보를 처음부터 다시 셉니다
    quizCount = 0;   // 질문에 답하면 보너스 퀴즈 세기도 0부터 다시 (5문장 뒤에 나와요)
    closeMenu();
    st.idx = 0; st.raw = []; st.wrong = false; st.rcD = -1; st.rcE = -1;
    var parts = [ko(OPT_NAMES[i] + "이 맞았어요."), ko(BUG[k].now), ko("명령:"), ko(BUG[k].cmd), ko(KNUM[version()] + " 버전을 열었어요.")];
    if (allDone()) parts.push(ko("6개를 모두 고쳤어요. 여기까지 끝!"));
    $("fb").textContent = (i + 1) + "번이 맞았어요. " + BUG[k].now + " 명령: " + BUG[k].cmd + " 버전 " + version() + " 을 열었어요.";
    render();
    speakSeq(parts.concat([enSent(SENT[st.si])]));   // 시간은 첫 키를 누를 때 시작해요
  }

  // 뒤로 가기: 마지막으로 고친 것을 되돌려 이전 버전으로 가요
  function goBackVersion() {
    if (nNew() === 0) { speakSeq([ko("처음 버전이에요. 더 돌아갈 수 없어요.")]); return; }
    st.fixed.pop(); closeMenu();
    quizCount = 0;
    st.combo = 0; st.streak = 0; st.pitch = 0;
    st.idx = 0; st.raw = []; st.wrong = false; st.rcD = -1; st.rcE = -1;
    $("fb").textContent = "버전 " + version() + "으로 돌아왔어요.";
    render();
    speakSeq([ko(KNUM[version()] + " 버전으로 돌아왔어요."), enSent(SENT[st.si])]);
  }

  /* 화면 */
  function renderSent() {
    var sh = "", sc = SENT[st.si];
    for (var i = 0; i < sc.length; i++) {
      var c = sc.charAt(i) === " " ? "&nbsp;" : sc.charAt(i);
      sh += (st.cA && st.cA.area === "sent" && st.cA.pos === i) ? '<mark class="cur">' + c + '</mark>' : c;
    }
    $("sent").innerHTML = sh;
    var th = "";
    st.raw.forEach(function (x, i) {
      var c = x.ch === " " ? "&nbsp;" : x.ch.replace("&", "&amp;").replace("<", "&lt;");
      th += (st.cA && st.cA.area === "typed" && st.cA.pos === i) ? '<mark class="cur">' + c + '</mark>' : c;
    });
    $("typed").innerHTML = "친 글자: " + th;
    $("cursor").textContent = !st.cA ? "커서: 없음" : (st.cA.area === "sent" ? "커서: 예시문장 " + (st.cA.pos + 1) + "번째 글자" : "커서: 내가 친 글자 " + (st.cA.pos + 1) + "번째");
    $("scoreline").textContent = (has("H4") || has("H5")) ? "점수: " + st.score + "점" : "";
  }

  function render() {
    $("ver").textContent = "버전 " + version() + " · " + (nNew() === 0 ? (BASE ? (BASE === POOL3.length ? "3회 끝난 상태" : "4회 끝난 상태") : "처음 버전") : "고친 것 " + nNew() + "개 적용") + " · 말하기 속도: " + SPEEDS[speedIdx].n;
    var sh = "", sc = SENT[st.si];
    for (var i = 0; i < sc.length; i++) {
      var c = sc.charAt(i) === " " ? "&nbsp;" : sc.charAt(i);
      sh += (st.cA && st.cA.area === "sent" && st.cA.pos === i) ? '<mark class="cur">' + c + '</mark>' : c;
    }
    $("sent").innerHTML = sh;
    var th = "";
    st.raw.forEach(function (x, i) {
      var c = x.ch === " " ? "&nbsp;" : x.ch.replace("&", "&amp;").replace("<", "&lt;");
      th += (st.cA && st.cA.area === "typed" && st.cA.pos === i) ? '<mark class="cur">' + c + '</mark>' : c;
    });
    $("typed").innerHTML = "친 글자: " + th;
    $("cursor").textContent = !st.cA ? "커서: 없음"
      : (st.cA.area === "sent" ? "커서: 예시문장 " + (st.cA.pos + 1) + "번째 글자" : "커서: 내가 친 글자 " + (st.cA.pos + 1) + "번째");
    $("btnPick").disabled = allDone();
    $("scoreline").textContent = (has("H4") || has("H5")) ? "점수: " + st.score + "점" : "";
    var html = '<h2>전체 구성</h2><p class="cur"><b>지금: 버전 ' + version() + '</b> (고친 것 ' + nNew() + ' / ' + POOL.length + ')</p><ol>';
    html += '<li class="' + (nNew() === 0 ? 'next' : '') + '">버전 1: ' + (BASE ? (BASE === POOL3.length ? '3회 최종 상태' : '4회 최종 상태') : '처음 상태') + '</li>';
    POOL.forEach(function (k, i) {
      var status = has(k) ? "done" : (cur() === k ? "next" : "");
      var mark = has(k) ? "✔ " : (cur() === k ? "▶ 다음 " : "□ ");
      html += '<li class="' + status + '">' + mark + (i + 1) + "번 고침 (버전 " + (i + 2) + "): " + BUG[k].short + "</li>";
    });
    html += "</ol>";
    $("side").innerHTML = html;
  }

  /* 문장 바꾸기 (문장 끝 엔터 후) */
  function changeSentence(dir, lead) {
    st.si = (st.si + dir + SENT.length) % SENT.length;
    st.pitch = 0;
    st.idx = 0; st.raw = []; st.wrong = false; st.rcD = -1; st.rcE = -1;
    $("fb").textContent = "";
    render();
    st.t0 = 0; stopClock();   // 다음 문장은 첫 키를 누를 때 시간을 다시 재요
    speakSeq((lead || []).concat([ko("다음 문장이에요."), enSent(SENT[st.si])]));
  }

  /* 5회 H3: 틀린 글자 없이 한 문장을 맞춰 엔터를 누르면 1문장 성공. 3문장 연속부터 콤보! */
  /* 보너스 퀴즈: 5문장마다 영어 단어 퀴즈. 맞히면 200점, 틀리면 100점 (H6 질문에 답한 게임에서만 나와요) */
  var QUIZ = [
    { ko: "고양이", en: "cat" }, { ko: "개", en: "dog" }, { ko: "사과", en: "apple" }, { ko: "책", en: "book" },
    { ko: "공", en: "ball" }, { ko: "태양", en: "sun" }, { ko: "물", en: "water" }, { ko: "학교", en: "school" },
    { ko: "집", en: "house" }, { ko: "나무", en: "tree" }, { ko: "빨간색", en: "red" }, { ko: "파란색", en: "blue" }
  ];
  var quizState = null, quizCount = 0, quizEvery = 5;
  function shuffleArr(a) {
    return a.map(function (x) { return [Math.random(), x]; }).sort(function (p, q) { return p[0] - q[0]; }).map(function (p) { return p[1]; });
  }
  function startQuiz(lead) {
    var q = QUIZ[Math.floor(Math.random() * QUIZ.length)];
    var others = shuffleArr(QUIZ.filter(function (x) { return x !== q; })).slice(0, 3);
    var opts = shuffleArr([q].concat(others));
    quizState = { q: q, opts: opts, ans: opts.indexOf(q) };
    quizCount = 0; quizEvery = 5;
    $("quizQ").textContent = "보너스 퀴즈! 이 말을 영어로 하면 무엇일까요? " + q.ko + "  (A, S, D, F 로 고르세요)";
    var box = $("quizOpts"); box.textContent = "";
    opts.forEach(function (o, i) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "btn";
      b.textContent = "ASDF"[i] + ". " + o.en;
      b.addEventListener("click", function () { ctx(); answerQuiz(i); });
      box.appendChild(b);
    });
    $("quiz").hidden = false;
    var parts = (lead || []).concat([ko("보너스 퀴즈예요!"), ko("이 말을 영어로 하면 무엇일까요?"), ko(q.ko)]);
    
    opts.forEach(function (o, i) { parts.push(ko(["에이", "에스", "디", "에프"][i]), enWord(o.en)); });
    parts.push(ko("일번은 에이, 이번은 에스, 삼번은 디, 사번은 에프를 누르면 선택할 수 있어요."));
    $("fb").textContent = "";
    speakSeq(parts);
  }
  function answerQuiz(i) {
    if (!quizState) return;
    var right = i === quizState.ans, answer = quizState.opts[quizState.ans];
    quizState = null;
    $("quiz").hidden = true;
    st.score += right ? 200 : 100;
    var res = right ? [ko("정답이에요!"), ko("200점")] : [ko("아쉬워요."), ko("정답은"), enWord(answer.en), ko("100점")];
    render();
    changeSentence(1, res);
  }
  function closeQuiz() { quizState = null; quizCount = 0; $("quiz").hidden = true; }

  function pressEnter() {
    var lead = [], msg = "";
    if (complete() && !st.wrong) {
      st.streak++;
      if (has("H3") && st.streak >= 3) { playCombo(); msg = "콤보! " + st.streak + "번째 콤보에요!"; }
    } else if (st.wrong && st.streak > 0) {
      st.streak = 0;                       // 틀린 채로 엔터를 누르면 콤보가 끊겨요
      msg = "틀린 글자가 있어서 콤보가 끊겼어요.";
    }
    if (!complete()) {
      var m = msg || "문장을 다 친 뒤에 엔터를 누르세요.";
      $("fb").textContent = m; speakSeq([ko(m)]);
      return;
    }
    if (!has("G")) return;
    if (msg) lead.push(ko(msg));
    st.sent = (st.sent || 0) + 1;
    if (!st.wrong) st.perfect = (st.perfect || 0) + 1;
    quizCount++;
    if (has("H6") && quizCount >= quizEvery) { startQuiz(lead); return; }   // 6번 질문을 고친 뒤에만, 5문장마다 보너스 퀴즈   // 5문장마다 보너스 퀴즈
    changeSentence(1, lead);
    if (msg) $("fb").textContent = msg;
  }

  /* 타이핑 */
  function complete() { return st.idx >= SENT[st.si].length; }
  // 칠 글자 목록을 새로 맞춰요: 칸 위치, 맞은 글자, 점수를 목록에 따라 다시 계산해요
  function setRaw(chars) {
    var tgt = SENT[st.si];
    var oldOk = st.raw.filter(function (x) { return x.ok; }).length;
    st.raw = chars.map(function (c, i) {
      return { ch: c, ok: c.toLowerCase() === (tgt.charAt(i) || "\u0000").toLowerCase() };
    });
    var newOk = st.raw.filter(function (x) { return x.ok; }).length;
    st.idx = st.raw.length;
    st.wrong = st.raw.some(function (x) { return !x.ok; });
    if (has("H4")) st.score = Math.max(0, st.score + 10 * (newOk - oldOk));
  }
  // 커서(좌우 화살표)가 있으면 그 글자 바로 뒤에 넣어요 (워드프로세서처럼)
  function insertAtCursorOld(ch) {
    var chars = st.raw.map(function (x) { return x.ch; });
    if (chars.length >= SENT[st.si].length) { say("문장이 다 찼어요. 지우고 다시 쳐 보세요."); return; }
    var p = st.cA.pos + 1;
    chars.splice(p, 0, ch);
    setRaw(chars);
    st.cA = { area: "typed", pos: p };
    // 커서 자리에 넣은 글자도 맞으면 소리가 한 단계 올라가고, 틀리면 처음으로 돌아가요
    if (st.raw[p].ok) st.pitch++; else st.pitch = 0;
    keySound(st.raw[p].ok);
    renderSent();
    speakSeq([engChar(ch)]);
  }
  function typeKey(ch) {
    var s = SENT[st.si];
    if (st.cA && st.cA.area === "typed" && st.raw.length) { insertAtCursorOld(ch); return; }
    if (complete()) { $("fb").textContent = "문장을 다 쳤어요. 엔터를 누르면 다음 문장이에요."; speakSeq([ko("문장을 다 쳤어요. 엔터를 누르면 다음 문장이에요.")]); return; }
    if (!st.t0) startClock();   // 첫 글자를 칠 때부터 시간을 재요
    var exp = s.charAt(st.idx), ok = ch.toLowerCase() === exp.toLowerCase();
    st.raw.push({ ch: ch, ok: ok });
