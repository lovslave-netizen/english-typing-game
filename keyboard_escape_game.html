<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사라진 황금 타자기 - 키보드 탐험대</title>
<style>
  :root {
    --bg: #fffdf5; --fg: #111111; --muted: #3d3d3d; --card: #ffffff; --line: #222222;
    --accent: #0b4fd6; --accent-fg: #ffffff;
    --ok: #0a6b34; --ok-bg: #d9f5e3; --bad: #b3261e; --bad-bg: #fde3e1; --focus: #ff8f00;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1419; --fg: #f7f7f7; --muted: #d6d6d6; --card: #1a222c; --line: #e9e9e9;
      --accent: #7fb0ff; --accent-fg: #0a1a33;
      --ok: #6ff0a0; --ok-bg: #123a24; --bad: #ff8a80; --bad-bg: #4a1a17; --focus: #ffd54a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1419; --fg: #f7f7f7; --muted: #d6d6d6; --card: #1a222c; --line: #e9e9e9;
    --accent: #7fb0ff; --accent-fg: #0a1a33;
    --ok: #6ff0a0; --ok-bg: #123a24; --bad: #ff8a80; --bad-bg: #4a1a17; --focus: #ffd54a;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    font-size: 22px; line-height: 1.6;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 30px; margin: 8px 0 12px; }
  h2 { font-size: 32px; line-height: 1.4; margin: 14px 0; }
  h2:focus { outline: none; }
  p { margin: 10px 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  button { font: inherit; color: inherit; }
  .btn {
    font-size: 22px; font-weight: 700; padding: 12px 20px; min-height: 56px;
    background: var(--card); color: var(--fg); border: 3px solid var(--line); border-radius: 12px; cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn:hover, .btn:focus-visible, .opt:hover, .opt:focus-visible { outline: 5px solid var(--focus); outline-offset: 2px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; margin: 18px 0; }
  .meta { color: var(--muted); font-size: 20px; margin: 0; }
  .opts { margin: 14px 0; }
  .opt {
    display: flex; align-items: center; gap: 16px; width: 100%; min-height: 70px;
    padding: 12px 18px; margin: 12px 0; font-size: 26px; text-align: left; cursor: pointer;
    background: var(--card); color: var(--fg); border: 3px solid var(--line); border-radius: 14px;
  }
  .opt .num {
    flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-fg); font-weight: 800; font-size: 24px;
  }
  .opt .txt { flex: 1; }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .opt.wrong::after { content: "틀림"; font-weight: 800; color: var(--bad); }
  .opt.right { background: var(--ok-bg); border-color: var(--ok); }
  .opt.right::after { content: "정답"; font-weight: 800; color: var(--ok); }
  .fb { min-height: 64px; padding: 12px 16px; border-left: 8px solid var(--accent); background: var(--card); border-radius: 8px; margin: 14px 0; }
  .fb.ok { border-left-color: var(--ok); }
  .fb.bad { border-left-color: var(--bad); }
  .hints { margin: 6px 0 0; padding-left: 28px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin: 14px 0; }
  .grid .btn { text-align: left; }
  .grid .btn.done { border-color: var(--ok); background: var(--ok-bg); }
  .word { font-size: 30px; letter-spacing: 6px; font-weight: 800; margin: 8px 0 16px; }
  .bigkey { font-size: 96px; font-weight: 900; text-align: center; margin: 10px 0; color: var(--accent); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  ul.keys { padding-left: 28px; }
  ul.keys li { margin: 6px 0; }
  .speedwrap { display: inline-flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 700; }
  .speedwrap select { font: inherit; font-weight: 700; min-height: 56px; padding: 8px 12px; background: var(--card); color: var(--fg); border: 3px solid var(--line); border-radius: 12px; cursor: pointer; }
  .speedwrap select:hover, .speedwrap select:focus-visible { outline: 5px solid var(--focus); outline-offset: 2px; }
  h3 { font-size: 24px; margin: 14px 0 6px; }
  .board { display: grid; gap: 4px; margin: 12px 0; width: max-content; max-width: 100%; }
  .cell { width: 64px; height: 64px; border: 3px solid var(--line); border-radius: 10px; display: grid; place-items: center; font-size: 34px; background: var(--card); }
  .cell.wall { background: var(--line); }
  .cell.goal { border-color: var(--ok); background: var(--ok-bg); }
  .prog { margin: 4px 0 8px; padding-left: 34px; min-height: 34px; }
  .pad { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
  .pad .btn { min-width: 84px; }
  .prog li.bad { color: var(--bad); font-weight: 800; }
  .rule { font-size: 28px; font-weight: 800; padding: 14px 16px; border: 4px solid var(--accent); border-radius: 12px; margin: 12px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>사라진 황금 타자기 · 키보드 탐험대</h1>
    <div class="bar" role="group" aria-label="설정">
      <button type="button" class="btn say" id="btnBack" aria-label="뒤로 가기. 이전 화면으로 돌아가요">← 뒤로 가기</button>
      <button type="button" class="btn say" id="btnReload" aria-label="새로고침. 지금 화면을 처음 상태로 다시 시작해요">새로고침</button>
      <button type="button" class="btn say" id="btnTts" aria-pressed="true">음성 안내: 켜짐</button>
      <button type="button" class="btn say" id="btnSfx" aria-pressed="true">효과음: 켜짐</button>
      <label class="speedwrap" for="rateSel">읽는 속도 <select id="rateSel" class="say" data-say="읽는 속도 선택. 위아래 화살표로 바꿔요" aria-label="읽는 속도"><option value="0">0.8배 (느리게)</option><option value="1">1배</option><option value="2">1.2배 (기본)</option><option value="3">1.5배</option><option value="4">1.7배</option><option value="5">2배 (가장 빠르게)</option></select></label>
      <label class="speedwrap" for="moveSel">이동 읽기 <select id="moveSel" class="say" data-say="로봇이 움직일 때 읽는 방법 선택. 위아래 화살표로 바꿔요" aria-label="이동 읽기"><option value="0">명령마다 짧게 (기본)</option><option value="1">한 칸마다 자세히</option><option value="2">소리만</option></select></label>
      <button type="button" class="btn say" id="btnHelp">도움말</button>
    </div>
  </header>
  <main id="main" aria-label="게임 화면"></main>
  <div id="live" class="sr" role="status" aria-live="polite"></div>
  <noscript><p>이 게임은 자바스크립트가 필요해요.</p></noscript>
</div>

<script src="voice/manifest.js"></script>
<script>
(function () {
  "use strict";

  /* ───────── 문제 데이터 ───────── */
  var SESSIONS = [
    { n: 1, t: "구성과 돌기 찾기", k: "T",
      intro: "키보드 탐험대, 출발! 오늘은 키보드의 비밀 나침반, 돌기 세 개를 찾는 첫 방탈출이에요. 맞히면 철컥, 틀리면 삐 소리가 나고 힌트를 줄게요.",
      qs: [
        { q: "1보드에서 돌기가 있는 조각은 어느 줄에 있나요?", o: ["숫자줄", "윗줄", "가운뎃줄", "아랫줄"], a: 2,
          h: ["CAP 조각이 맨 왼쪽에 있는 줄이에요. 아랫줄 바로 위예요.", "왼손 검지가 닿는 곳이에요.", "가장 왼쪽 긴 칸에서 오른쪽으로 네 번째 칸이에요."],

          h: ["1보드 가운뎃줄과 한 줄로 이어지는 줄이에요.", "오른손 검지가 닿는 곳이에요.", "맨 왼쪽 칸 바로 오른쪽 칸이에요."],

    { n: 2, t: "A S D G와 Q W E R T", k: "Y",

    else if (a === "mrun") { runProg(); focusHeading(); }
    else if (a === "mundo") { undoCmd(); focusHeading(); }
    else if (a === "mclear") { clearCmds(); focusHeading(); }
    else if (a === "mreadprog") { readProg(); focusHeading(); }
    else if (a === "mlook") { lookAround(); focusHeading(); }
    else if (a === "mlog") { readLog(); focusHeading(); }
    else if (a === "mseq") { seqAdd(+b.getAttribute("data-i")); focusHeading(); }
    else if (a === "mrec") { toggleRec(); focusHeading(); }
    else if (a === "mbundle") { addBundle(); focusHeading(); }
    else if (a === "mrule") { ruleAct(b.getAttribute("data-a")); focusHeading(); }
    else if (a === "msignal") { ruleSignal(); focusHeading(); }
    else if (a === "mdigit") { boxDigit(b.getAttribute("data-k")); focusHeading(); }
    else if (a === "mback") { boxBack(); focusHeading(); }
    else if (a === "msubmit") { boxSubmit(); focusHeading(); }
    else if (a === "mnarr") { speak(S.narr); }
    else if (a === "mnext") { mNext(); }
    else if (a === "mskip") { S.screen = "q"; render(); }
    else if (a === "toSelect") { S.resetArmed = false; S.screen = "select"; render(); }
    else if (a === "nextSession") startSession(SESSIONS[S.si].n + 1);
    else if (a === "opt") choose(+b.getAttribute("data-i"));
    else if (a === "repeat") { speak(S.narr); }
    else if (a === "hint") hintBtn();
    else if (a === "next") nextQ();
    else if (a === "helpBack") { S.screen = S.helpFrom; render(); }
    else if (a === "reset") {
      if (!S.resetArmed) { S.resetArmed = true; var t = "정말 지울까요? 한 번 더 누르면 모은 열쇠 글자가 모두 지워져요."; b.textContent = "정말 지울까요? 한 번 더 누르세요"; speak(t); announce(t); }
      else { store.cleared = {}; save(); S.resetArmed = false; render(); }
    }
  });

  /* 설정 버튼 */
  function refreshBar() {
    var t = document.getElementById("btnTts"), f = document.getElementById("btnSfx"), r = document.getElementById("rateSel");
    t.textContent = "음성 안내: " + (store.tts ? "켜짐" : "꺼짐"); t.setAttribute("aria-pressed", store.tts ? "true" : "false");
    f.textContent = "효과음: " + (store.sfx ? "켜짐" : "꺼짐"); f.setAttribute("aria-pressed", store.sfx ? "true" : "false");
    r.value = String(store.rateI2);
  }
  document.getElementById("btnTts").addEventListener("click", function () {
    ctx(); store.tts = !store.tts; save(); refreshBar();
    if (store.tts) speak("음성 안내를 켰어요."); else { stopSpeech(); announce("음성 안내를 껐어요."); }
  });
  document.getElementById("btnSfx").addEventListener("click", function () {
    ctx(); store.sfx = !store.sfx; save(); refreshBar();
    var t = store.sfx ? "효과음을 켰어요." : "효과음을 껐어요."; announce(t); speak(t); if (store.sfx) SFX.ding();
  });
  document.getElementById("rateSel").addEventListener("change", function () {
    ctx(); store.rateI2 = +this.value; save();
    var t = "읽는 속도 " + RATE_NAMES[store.rateI2]; announce(t); speak(t + "예요. 이 속도로 읽어요.");
  });
  document.getElementById("btnHelp").addEventListener("click", function () {
    ctx(); if (S.screen !== "help") { S.helpFrom = S.screen; S.screen = "help"; render(); }
  });

  /* 마우스를 올리거나 탭으로 이동하면 읽어 주기 */
  function sayEl(el) {
    var t = el.getAttribute("data-say") || el.getAttribute("aria-label") || el.textContent;
    speak(t);
  }
  var lastSay = null, lastMove = 0, lastX = -1, lastY = -1;
  document.addEventListener("mousemove", function (e) {
    if (e.screenX !== lastX || e.screenY !== lastY) { lastMove = performance.now(); lastX = e.screenX; lastY = e.screenY; }
  });
  document.addEventListener("mouseover", function (e) {
    var el = e.target.closest && e.target.closest(".say,[data-say]");
    if (!el || el === lastSay) return;
    if (performance.now() - lastMove > 250) return;
    lastSay = el; sayEl(el);
  });
  document.addEventListener("mouseout", function (e) {
    var el = e.target.closest && e.target.closest(".say,[data-say]");
    if (el && lastSay === el && !el.contains(e.relatedTarget)) lastSay = null;
  });
  document.addEventListener("focusin", function (e) {
    if (performance.now() < muteUntil) return;
    var el = e.target.closest && e.target.closest(".say,[data-say]");
    if (el) sayEl(el);
  });

  /* 키보드 단축키 */
  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    var k = e.key, L = letterOf(e);
    if (k === "Escape") { stopSpeech(); return; }
    if (L === "r") { if (S.narr) { speak(S.narr); } return; }
    if (S.screen === "m") { mKey(e); return; }
    if (S.screen !== "q") return;
    if (/^[1-9]$/.test(k)) { var q = SESSIONS[S.si].qs[S.qi], i = +k - 1; if (i < q.o.length) { e.preventDefault(); ctx(); choose(i); } }
    else if (L === "h") hintBtn();
    else if (L === "n") nextQ();
  });

  refreshBar();
  render();
})();
</script>
</body>
</html>
